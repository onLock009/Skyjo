document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0c2ea6ee-7582-491a-8083-a3ec8c1b0430\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a1db30a4-3997-4f01-a62a-5662f25d72f0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"28aeb8ba-157c-4614-94e6-2bf555ff8d1f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"78fb9328-4554-4d05-a60f-9cfb6c0f1a8d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d05e3b7f-bd77-4c7a-a813-e381b3eae914\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e8477e09-d4aa-409f-ac83-f30702dabc9c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9ae86aa1-d80c-48f0-9493-eb93e16a3191\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin:0; padding:0; background:#ddd6c6; -webkit-text-size-adjust:100%; }\n  body { font-family:'Courier Prime', ui-monospace, monospace; color:#231f1a; }\n  * { box-sizing:border-box; }\n  a { color:#a83a2b; text-decoration:underline; }\n  a:hover { color:#7d2a1e; }\n  input, button { font-family:inherit; }\n  input[type=number] { -moz-appearance:textfield; }\n  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }\n  input:focus-visible, button:focus-visible { outline:2px solid #a83a2b; outline-offset:1px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#ddd6c6; display:flex; justify-content:center; padding:0 0 40px\">\n<div style=\"width:100%; max-width:430px; background:#f4efe2; background-image:repeating-linear-gradient(#f4efe2 0px, #f4efe2 33px, rgba(35,31,26,0.10) 34px); box-shadow:0 1px 0 rgba(255,255,255,0.6) inset, 0 14px 34px rgba(35,31,26,0.18); min-height:100vh; padding:0 18px 28px; position:relative\">\n\n  <div style=\"display:flex; align-items:flex-end; justify-content:space-between; padding:22px 0 6px; border-bottom:2px solid #231f1a\">\n    <div>\n      <div style=\"font-size:27px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; line-height:1\">Skyjo<\u002Fdiv>\n      <div style=\"font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:#8a8072; margin-top:5px\">Punkteblatt<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right; font-size:12px; line-height:1.5; color:#8a8072\">\n      <div>Limit {{ limit }}<\u002Fdiv>\n      <div>Runde {{ roundLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding-top:22px\">\n      <div style=\"font-size:13px; letter-spacing:0.18em; text-transform:uppercase; color:#8a8072; margin-bottom:12px\">Wer spielt mit?<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:10px\">\n        <sc-for list=\"{{ nameRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; align-items:center; gap:10px\">\n            <div style=\"width:22px; font-size:15px; color:#a89e8e; text-align:right\">{{ row.no }}<\u002Fdiv>\n            <input value=\"{{ row.value }}\" sc-camel-on-change=\"{{ row.onChange }}\" placeholder=\"{{ row.placeholder }}\" style=\"flex:1; min-width:0; height:46px; padding:0 12px; font-size:17px; color:#231f1a; background:rgba(255,255,255,0.55); border:1px solid rgba(35,31,26,0.28); border-radius:2px\">\n            <button sc-camel-on-click=\"{{ row.onRemove }}\" aria-label=\"Spieler entfernen\" style=\"width:44px; height:44px; flex:none; font-size:20px; color:#8a8072; background:transparent; border:1px solid rgba(35,31,26,0.16); border-radius:2px; cursor:pointer\" style-hover=\"color:#a83a2b; border-color:#a83a2b\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ addPlayer }}\" style=\"margin-top:12px; width:100%; height:46px; font-size:15px; letter-spacing:0.1em; text-transform:uppercase; color:#231f1a; background:transparent; border:1px dashed rgba(35,31,26,0.42); border-radius:2px; cursor:pointer\" style-hover=\"background:rgba(35,31,26,0.05)\">+ Spieler<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ startGame }}\" disabled=\"{{ startDisabled }}\" style=\"margin-top:26px; width:100%; height:56px; font-size:17px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#f4efe2; background:#231f1a; border:none; border-radius:2px; cursor:pointer\" style-hover=\"background:#a83a2b\">Spiel starten<\u002Fbutton>\n      <div style=\"margin-top:26px; padding-top:16px; border-top:1px solid rgba(35,31,26,0.2); font-size:13px; line-height:1.7; color:#6f665a\">\n        <div style=\"letter-spacing:0.18em; text-transform:uppercase; color:#8a8072; margin-bottom:8px\">So läuft's<\u002Fdiv>\n        <div>Nach jeder Runde trägt jeder seine Kartensumme ein — Minuswerte gehen auch. Sobald am Rundenende jemand {{ limit }} Punkte oder mehr hat, ist Schluss. Gewonnen hat, wer die <i>wenigsten<\u002Fi> Punkte hat.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPlaying }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding-top:18px\">\n\n      <div style=\"overflow-x:auto; margin:0 -18px; padding:0 18px 4px\">\n        <div style=\"display:inline-block; min-width:max-content\">\n          <div style=\"display:flex; align-items:flex-end; gap:6px; padding-bottom:6px; border-bottom:1px solid rgba(35,31,26,0.35)\">\n            <div style=\"width:26px; flex:none; font-size:11px; color:#a89e8e\">R<\u002Fdiv>\n            <sc-for list=\"{{ players }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"width:62px; flex:none; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#6f665a; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ p.short }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"width:34px; flex:none\"><\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ roundRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex; align-items:center; gap:6px; height:34px; border-bottom:1px solid rgba(35,31,26,0.10)\">\n              <div style=\"width:26px; flex:none; font-size:13px; color:#a89e8e\">{{ r.no }}<\u002Fdiv>\n              <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div style=\"width:62px; flex:none; font-size:17px; text-align:right; color:#231f1a\">{{ c.v }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ r.onDelete }}\" aria-label=\"Runde löschen\" style=\"width:34px; height:30px; flex:none; font-size:15px; color:#c0b7a7; background:transparent; border:none; cursor:pointer\" style-hover=\"color:#a83a2b\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display:flex; align-items:center; gap:6px; height:44px; margin-top:2px; border-top:2px solid #231f1a\">\n            <div style=\"width:26px; flex:none; font-size:11px; letter-spacing:0.1em; color:#8a8072\">Σ<\u002Fdiv>\n            <sc-for list=\"{{ players }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"width:62px; flex:none; font-size:22px; font-weight:700; text-align:right; color:{{ p.totalColor }}\">{{ p.total }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"width:34px; flex:none\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px; padding:16px; background:rgba(255,255,255,0.5); border:1px solid rgba(35,31,26,0.22); border-radius:2px\">\n        <div style=\"display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px\">\n          <div style=\"font-size:13px; letter-spacing:0.18em; text-transform:uppercase; color:#6f665a\">{{ entryTitle }}<\u002Fdiv>\n          <div style=\"font-size:12px; color:#a89e8e\">{{ draftSum }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px\">\n          <sc-for list=\"{{ draftRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; align-items:center; gap:10px\">\n              <div style=\"flex:1; min-width:0; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ row.name }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ row.onFlip }}\" aria-label=\"Vorzeichen wechseln\" style=\"width:44px; height:46px; flex:none; font-size:18px; color:#6f665a; background:transparent; border:1px solid rgba(35,31,26,0.18); border-radius:2px; cursor:pointer\" style-hover=\"color:#a83a2b; border-color:#a83a2b\">±<\u002Fbutton>\n              <input type=\"number\" inputmode=\"numeric\" value=\"{{ row.value }}\" sc-camel-on-change=\"{{ row.onChange }}\" placeholder=\"0\" style=\"width:88px; flex:none; height:46px; padding:0 10px; font-size:20px; font-weight:700; text-align:right; color:#231f1a; background:#fbf8f1; border:1px solid rgba(35,31,26,0.3); border-radius:2px\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ submitRound }}\" style=\"margin-top:16px; width:100%; height:54px; font-size:16px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#f4efe2; background:#231f1a; border:none; border-radius:2px; cursor:pointer\" style-hover=\"background:#a83a2b\">{{ submitLabel }}<\u002Fbutton>\n        <sc-if value=\"{{ isEditing }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ cancelEdit }}\" style=\"margin-top:8px; width:100%; height:40px; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:#6f665a; background:transparent; border:1px solid rgba(35,31,26,0.2); border-radius:2px; cursor:pointer\">Abbrechen<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; font-size:12px; color:#8a8072\">\n        <div>{{ leaderNote }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ reset }}\" style=\"flex:none; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8072; background:transparent; border:none; text-decoration:underline; cursor:pointer\" style-hover=\"color:#a83a2b\">Abbrechen<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding-top:34px\">\n      <div style=\"font-size:13px; letter-spacing:0.2em; text-transform:uppercase; color:#8a8072\">Endstand nach {{ roundCount }} Runden<\u002Fdiv>\n      <div style=\"margin-top:14px; padding:20px 18px; border:2px solid #231f1a; border-radius:2px; background:rgba(255,255,255,0.5)\">\n        <div style=\"font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#a83a2b\">Gewinner<\u002Fdiv>\n        <div style=\"font-size:34px; font-weight:700; line-height:1.15; margin-top:6px; text-wrap:balance\">{{ winnerName }}<\u002Fdiv>\n        <div style=\"font-size:16px; color:#6f665a; margin-top:4px\">{{ winnerLine }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px; display:flex; flex-direction:column\">\n        <sc-for list=\"{{ standings }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; align-items:center; gap:12px; height:46px; border-bottom:1px solid rgba(35,31,26,0.14)\">\n            <div style=\"width:26px; flex:none; font-size:14px; color:#a89e8e\">{{ s.rank }}<\u002Fdiv>\n            <div style=\"flex:1; min-width:0; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ s.name }}<\u002Fdiv>\n            <div style=\"font-size:12px; color:#a89e8e\">{{ s.detail }}<\u002Fdiv>\n            <div style=\"width:62px; flex:none; font-size:21px; font-weight:700; text-align:right\">{{ s.total }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ rematch }}\" style=\"margin-top:26px; width:100%; height:56px; font-size:16px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#f4efe2; background:#231f1a; border:none; border-radius:2px; cursor:pointer\" style-hover=\"background:#a83a2b\">Revanche<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ reset }}\" style=\"margin-top:10px; width:100%; height:46px; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; color:#231f1a; background:transparent; border:1px solid rgba(35,31,26,0.3); border-radius:2px; cursor:pointer\" style-hover=\"background:rgba(35,31,26,0.05)\">Neue Spielerliste<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:880},&quot;pointLimit&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:20,&quot;max&quot;:500,&quot;step&quot;:10,&quot;section&quot;:&quot;Regeln&quot;},&quot;showStats&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Endstand&quot;}}\">\nconst KEY = 'skyjo-scoresheet-v1';\n\nclass Component extends DCLogic {\n  state = { phase: 'setup', names: ['', '', ''], players: [], rounds: [], draft: [], editIndex: null };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) {\n        const s = JSON.parse(raw);\n        if (s && s.phase) this.setState({ ...s, editIndex: null });\n      }\n    } catch (e) {}\n  }\n\n  persist(next) {\n    this.setState(next, () => {\n      const { phase, names, players, rounds, draft } = this.state;\n      try { localStorage.setItem(KEY, JSON.stringify({ phase, names, players, rounds, draft })); } catch (e) {}\n    });\n  }\n\n  get limit() { return this.props.pointLimit ?? 100; }\n\n  totals() {\n    return this.state.players.map((_, i) => this.state.rounds.reduce((a, r) => a + (r[i] || 0), 0));\n  }\n\n  setName(i, v) {\n    const names = this.state.names.slice();\n    names[i] = v;\n    this.persist({ names });\n  }\n\n  addPlayer = () => this.persist({ names: this.state.names.concat('') });\n\n  removePlayer(i) {\n    const names = this.state.names.slice();\n    names.splice(i, 1);\n    this.persist({ names: names.length ? names : [''] });\n  }\n\n  startGame = () => {\n    const players = this.state.names.map((n, i) => (n || '').trim() || 'Spieler ' + (i + 1));\n    if (players.length < 2) return;\n    this.persist({ phase: 'game', players, rounds: [], draft: players.map(() => ''), editIndex: null });\n  };\n\n  setDraft(i, v) {\n    const draft = this.state.draft.slice();\n    draft[i] = v.replace(/[^-\\d]/g, '');\n    this.persist({ draft });\n  }\n\n  flip(i) {\n    const draft = this.state.draft.slice();\n    const v = String(draft[i] || '');\n    draft[i] = v.startsWith('-') ? v.slice(1) : (v ? '-' + v : '-');\n    this.persist({ draft });\n  }\n\n  submitRound = () => {\n    const nums = this.state.draft.map(v => {\n      const n = parseInt(v, 10);\n      return isNaN(n) ? 0 : n;\n    });\n    const rounds = this.state.rounds.slice();\n    if (this.state.editIndex != null) rounds[this.state.editIndex] = nums;\n    else rounds.push(nums);\n    const totals = this.state.players.map((_, i) => rounds.reduce((a, r) => a + (r[i] || 0), 0));\n    const over = totals.some(t => t >= this.limit);\n    this.persist({\n      rounds,\n      draft: this.state.players.map(() => ''),\n      editIndex: null,\n      phase: over ? 'done' : 'game'\n    });\n  };\n\n  deleteRound(i) {\n    const rounds = this.state.rounds.slice();\n    rounds.splice(i, 1);\n    this.persist({ rounds, editIndex: null, draft: this.state.players.map(() => '') });\n  }\n\n  cancelEdit = () => this.persist({ editIndex: null, draft: this.state.players.map(() => '') });\n\n  rematch = () => this.persist({ phase: 'game', rounds: [], draft: this.state.players.map(() => ''), editIndex: null });\n\n  reset = () => this.persist({ phase: 'setup', players: [], rounds: [], draft: [], editIndex: null });\n\n  renderVals() {\n    const st = this.state;\n    const limit = this.limit;\n    const totals = this.totals();\n    const min = totals.length ? Math.min.apply(null, totals) : 0;\n    const editing = st.editIndex != null;\n\n    const draftNums = st.draft.map(v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; });\n    const draftSum = st.draft.some(v => v !== '' && v !== '-') ? 'Summe ' + draftNums.reduce((a, b) => a + b, 0) : '';\n\n    const sorted = st.players.map((n, i) => ({ n, t: totals[i], i })).sort((a, b) => a.t - b.t);\n    const best = sorted[0];\n    const tied = sorted.filter(s => s.t === (best ? best.t : 0));\n\n    const roundsPlayed = st.rounds.length;\n\n    return {\n      limit,\n      isSetup: st.phase === 'setup',\n      isPlaying: st.phase === 'game',\n      isDone: st.phase === 'done',\n      roundLabel: st.phase === 'setup' ? '–' : (editing ? st.editIndex + 1 : roundsPlayed + 1),\n      roundCount: roundsPlayed,\n\n      nameRows: st.names.map((v, i) => ({\n        no: i + 1,\n        value: v,\n        placeholder: 'Spieler ' + (i + 1),\n        onChange: e => this.setName(i, e.target.value),\n        onRemove: () => this.removePlayer(i)\n      })),\n      addPlayer: this.addPlayer,\n      startGame: this.startGame,\n      startDisabled: st.names.length < 2,\n\n      players: st.players.map((n, i) => ({\n        short: n,\n        total: totals[i],\n        totalColor: totals[i] >= limit ? '#a83a2b' : (totals[i] === min ? '#1f6b4f' : '#231f1a')\n      })),\n      roundRows: st.rounds.map((r, ri) => ({\n        no: ri + 1,\n        cells: st.players.map((_, i) => ({ v: r[i] || 0 })),\n        onDelete: () => this.deleteRound(ri)\n      })),\n\n      draftRows: st.players.map((n, i) => ({\n        name: n,\n        value: st.draft[i] ?? '',\n        onChange: e => this.setDraft(i, e.target.value),\n        onFlip: () => this.flip(i)\n      })),\n      draftSum,\n      entryTitle: editing ? 'Runde ' + (st.editIndex + 1) + ' korrigieren' : 'Runde ' + (roundsPlayed + 1) + ' eintragen',\n      submitLabel: editing ? 'Korrektur speichern' : 'Runde eintragen',\n      submitRound: this.submitRound,\n      isEditing: editing,\n      cancelEdit: this.cancelEdit,\n      leaderNote: st.players.length\n        ? (tied.length > 1 ? 'Gleichstand vorn bei ' + tied[0].t : 'Vorn: ' + (best ? best.n : '') + ' mit ' + (best ? best.t : 0)) + ' · Ende bei ' + limit\n        : '',\n\n      standings: sorted.map((s, k) => ({\n        rank: k + 1,\n        name: s.n,\n        total: s.t,\n        detail: (this.props.showStats ?? true) && roundsPlayed\n          ? 'Ø ' + (Math.round((s.t / roundsPlayed) * 10) / 10)\n          : ''\n      })),\n      winnerName: tied.length > 1 ? tied.map(s => s.n).join(' & ') : (best ? best.n : ''),\n      winnerLine: best ? (tied.length > 1 ? 'Gleichstand mit ' + best.t + ' Punkten' : best.t + ' Punkte — die wenigsten am Tisch') : '',\n      rematch: this.rematch,\n      reset: this.reset\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
